global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # - job_name: node-exporter
  #   static_configs:
  #     - targets:
  #         - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: user-service
    static_configs:
      - targets:
          - user-service:8002

  - job_name: course-service
    static_configs:
      - targets:
          - course-service:8003

  - job_name: progress-service
    static_configs:
      - targets:
          - progress-service:8004

  - job_name: inscription-service
    static_configs:
      - targets:
          - inscription-service:8005

  # - job_name: notification-service
  #   static_configs:
  #     - targets:
  #         - notification-service:8011